<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="Decorative Orion cosmic environment">
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#17313a"/>
      <stop offset=".36" stop-color="#0a171d"/>
      <stop offset="1" stop-color="#020609"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#10272f"/>
      <stop offset=".46" stop-color="#08151a"/>
      <stop offset=".82" stop-color="#02070a"/>
      <stop offset="1" stop-color="#000203"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6fbff" stop-opacity=".9"/>
      <stop offset=".22" stop-color="#5dd8e6" stop-opacity=".82"/>
      <stop offset=".55" stop-color="#2c8794" stop-opacity=".25"/>
      <stop offset=".82" stop-color="#74e8f2" stop-opacity=".78"/>
      <stop offset="1" stop-color="#d8fdff" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15262d"/>
      <stop offset=".28" stop-color="#0b151a"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ce9f3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6ce9f3" stop-opacity=".82"/>
      <stop offset="1" stop-color="#6ce9f3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64deea" stop-opacity=".16"/>
      <stop offset="1" stop-color="#64deea" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <rect width="1600" height="760" filter="url(#grain)" opacity=".32"/>

  <g fill="#b8f5fa" opacity=".56">
    <circle cx="112" cy="84" r="1.1"/><circle cx="183" cy="146" r=".9"/>
    <circle cx="266" cy="106" r="1.2"/><circle cx="354" cy="64" r=".8"/>
    <circle cx="438" cy="138" r="1.0"/><circle cx="527" cy="88" r=".8"/>
    <circle cx="1078" cy="70" r="1.1"/><circle cx="1168" cy="128" r=".9"/>
    <circle cx="1264" cy="88" r="1.2"/><circle cx="1364" cy="140" r=".8"/>
    <circle cx="1475" cy="72" r="1.0"/><circle cx="1518" cy="176" r=".7"/>
    <circle cx="325" cy="246" r=".8"/><circle cx="1228" cy="232" r=".7"/>
    <circle cx="1326" cy="284" r=".9"/><circle cx="236" cy="298" r=".7"/>
  </g>

  <circle cx="-92" cy="454" r="330" fill="#081116" stroke="#29434c" stroke-width="2" opacity=".92"/>
  <ellipse cx="98" cy="344" rx="230" ry="52" fill="#153039" opacity=".22" filter="url(#soft)"/>

  <ellipse cx="800" cy="284" rx="248" ry="248" fill="#53dcea" opacity=".055" filter="url(#soft)"/>
  <circle cx="800" cy="284" r="220" fill="none" stroke="#66e7f1" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="800" cy="284" r="198" fill="none" stroke="#84eff7" stroke-opacity=".18" stroke-width="1"/>
  <circle cx="800" cy="284" r="180" fill="url(#orb)" stroke="url(#rim)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="800" cy="284" r="171" fill="none" stroke="#91f3f8" stroke-opacity=".12" stroke-width="1"/>
  <ellipse cx="800" cy="284" rx="244" ry="108" fill="none" stroke="#72dce6" stroke-opacity=".16"/>
  <ellipse cx="800" cy="284" rx="224" ry="132" fill="none" stroke="#72dce6" stroke-opacity=".09" transform="rotate(-17 800 284)"/>

  <path d="M667 245 C705 190 756 164 800 164 C844 164 895 190 933 245"
        fill="none" stroke="#6fe6ef" stroke-opacity=".08" stroke-width="34" filter="url(#soft)"/>
  <path d="M676 300 C716 341 755 360 800 360 C845 360 884 341 924 300"
        fill="none" stroke="#4db7c2" stroke-opacity=".055" stroke-width="30" filter="url(#soft)"/>

  <rect x="797" y="42" width="6" height="162" fill="#8ef1f6" opacity=".48" filter="url(#glow)"/>
  <rect x="798.5" y="42" width="3" height="162" fill="#d8fdff" opacity=".68"/>
  <rect x="797" y="358" width="6" height="108" fill="#8ef1f6" opacity=".30" filter="url(#glow)"/>
  <rect x="798.5" y="358" width="3" height="108" fill="#d8fdff" opacity=".45"/>

  <path d="M650 476 C690 458 750 452 800 452 C850 452 910 458 950 476"
        fill="none" stroke="#4f6970" stroke-width="2" opacity=".76"/>
  <path d="M546 502 C642 480 712 486 800 486 C888 486 958 480 1054 502"
        fill="none" stroke="#33484f" stroke-width="2" opacity=".54"/>

  <path d="M0 492 C160 468 322 480 466 470 C618 460 696 474 800 474 C904 474 982 460 1134 470 C1278 480 1440 468 1600 492 L1600 760 L0 760 Z"
        fill="url(#floor)"/>
  <path d="M0 506 C250 486 432 496 610 488 C776 480 988 486 1600 504"
        fill="none" stroke="#365059" stroke-width="2" opacity=".66"/>
  <path d="M190 532 L1410 532" stroke="url(#cyanLine)" stroke-width="1.2" opacity=".32"/>
  <path d="M306 570 L1294 570" stroke="url(#cyanLine)" stroke-width="1" opacity=".20"/>
  <path d="M464 612 L1136 612" stroke="url(#cyanLine)" stroke-width="1" opacity=".14"/>

  <path d="M605 506 L556 760 L718 760 L752 506 Z" fill="#091116" opacity=".88"/>
  <path d="M995 506 L1044 760 L882 760 L848 506 Z" fill="#091116" opacity=".88"/>
  <path d="M618 508 L590 744" stroke="#29444c" stroke-width="2" opacity=".55"/>
  <path d="M982 508 L1010 744" stroke="#29444c" stroke-width="2" opacity=".55"/>

  <g opacity=".72">
    <path d="M474 504 L474 458 L486 447 L498 458 L498 504" fill="#050a0d" stroke="#34535d"/>
    <path d="M1102 504 L1102 458 L1114 447 L1126 458 L1126 504" fill="#050a0d" stroke="#34535d"/>
    <circle cx="486" cy="449" r="3" fill="#77eaf2" filter="url(#glow)"/>
    <circle cx="1114" cy="449" r="3" fill="#77eaf2" filter="url(#glow)"/>
  </g>

  <path d="M700 502 L756 760 L844 760 L900 502" fill="url(#reflection)" opacity=".32"/>
  <path d="M798 502 L798 760" stroke="#66e7f1" stroke-opacity=".16"/>
  <path d="M802 502 L802 760" stroke="#66e7f1" stroke-opacity=".08"/>

  <rect x="0" y="0" width="1600" height="760" fill="none" stroke="#8ceff5" stroke-opacity=".04" stroke-width="2"/>
</svg>