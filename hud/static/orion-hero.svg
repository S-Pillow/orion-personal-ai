    <linearGradient id="planetRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8feaf0" stop-opacity="0"/>
      <stop offset=".58" stop-color="#9cf1f5" stop-opacity=".13"/>
      <stop offset=".82" stop-color="#baf9fc" stop-opacity=".42"/>
      <stop offset="1" stop-color="#dffeff" stop-opacity=".05"/>
