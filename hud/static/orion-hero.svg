<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Decorative Orion deep-space environment">
  <defs>
    <radialGradient id="sky" cx="50%" cy="24%" r="86%">
      <stop offset="0" stop-color="#17313b"/>
      <stop offset=".34" stop-color="#0b1a21"/>
      <stop offset=".72" stop-color="#061015"/>
      <stop offset="1" stop-color="#020609"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17303a"/>
      <stop offset=".18" stop-color="#0e2128"/>
      <stop offset=".55" stop-color="#071116"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64dce7" stop-opacity="0"/>
      <stop offset=".25" stop-color="#64dce7" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#b0f8fc" stop-opacity=".58"/>
      <stop offset=".75" stop-color="#64dce7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#64dce7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dffeff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#b5fbff" stop-opacity=".66"/>
      <stop offset=".52" stop-color="#66dce7" stop-opacity=".9"/>
      <stop offset=".82" stop-color="#a8f8fc" stop-opacity=".38"/>
      <stop offset="1" stop-color="#dffeff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef1f6" stop-opacity=".25"/>
      <stop offset=".42" stop-color="#4ec7d2" stop-opacity=".07"/>
      <stop offset="1" stop-color="#4ec7d2" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur7" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="31" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m"><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="278" rx="650" ry="260" fill="#16414b" opacity=".08" filter="url(#blur24)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".34"/>

