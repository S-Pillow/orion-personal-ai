<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="Decorative Orion cosmic environment">
  <defs>
    <radialGradient id="sky" cx="50%" cy="32%" r="84%">
      <stop offset="0" stop-color="#18333d"/>
      <stop offset=".34" stop-color="#0b1b22"/>
      <stop offset=".7" stop-color="#061015"/>
      <stop offset="1" stop-color="#020609"/>
    </radialGradient>
    <radialGradient id="coreVolume" cx="42%" cy="31%" r="72%">
      <stop offset="0" stop-color="#17353f"/>
      <stop offset=".22" stop-color="#102832"/>
      <stop offset=".47" stop-color="#09181f"/>
      <stop offset=".72" stop-color="#03090d"/>
      <stop offset="1" stop-color="#000203"/>
    </radialGradient>
    <radialGradient id="coreSheen" cx="40%" cy="23%" r="64%">
      <stop offset="0" stop-color="#d4fcff" stop-opacity=".16"/>
      <stop offset=".22" stop-color="#83e7ef" stop-opacity=".06"/>
      <stop offset=".48" stop-color="#4cbfca" stop-opacity=".015"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreShade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#15313a" stop-opacity=".34"/>
      <stop offset=".44" stop-color="#071116" stop-opacity=".12"/>
      <stop offset=".66" stop-color="#000" stop-opacity=".48"/>
      <stop offset="1" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9faff" stop-opacity=".12"/>
      <stop offset=".10" stop-color="#b9fbff" stop-opacity=".86"/>
      <stop offset=".22" stop-color="#5edbe7" stop-opacity=".72"/>
      <stop offset=".47" stop-color="#1a6670" stop-opacity=".18"/>
      <stop offset=".70" stop-color="#0b343b" stop-opacity=".08"/>
      <stop offset=".88" stop-color="#70e7f0" stop-opacity=".76"/>
      <stop offset="1" stop-color="#d9fdff" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="eyeLightL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63dfe9" stop-opacity=".08"/>
      <stop offset=".18" stop-color="#7cebf2" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#d7fdff" stop-opacity=".98"/>
      <stop offset=".74" stop-color="#75e8f0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2ba0ae" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="eyeLightR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#63dfe9" stop-opacity=".08"/>
      <stop offset=".18" stop-color="#7cebf2" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#d7fdff" stop-opacity=".98"/>
      <stop offset=".74" stop-color="#75e8f0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2ba0ae" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183039"/>
      <stop offset=".18" stop-color="#102127"/>
      <stop offset=".58" stop-color="#071116"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fdff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#a8f8fc" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#62dce8" stop-opacity=".9"/>
      <stop offset=".8" stop-color="#a8f8fc" stop-opacity=".52"/>
      <stop offset="1" stop-color="#d9fdff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61dbe6" stop-opacity="0"/>
      <stop offset=".25" stop-color="#61dbe6" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#a8f8fc" stop-opacity=".52"/>
      <stop offset=".75" stop-color="#61dbe6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#61dbe6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef1f6" stop-opacity=".26"/>
      <stop offset=".36" stop-color="#4ec7d2" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4ec7d2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowM" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="haze" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="29" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m"><feFuncA type="table" tableValues="0 .042"/></feComponentTransfer>
    </filter>
    <clipPath id="coreClip"><circle cx="800" cy="246" r="144"/></clipPath>
    <mask id="beamMask">
      <rect width="1600" height="760" fill="white"/>
      <circle cx="800" cy="246" r="149" fill="black"/>
    </mask>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <ellipse cx="800" cy="302" rx="610" ry="244" fill="#17404a" opacity=".09" filter="url(#haze)"/>
  <rect width="1600" height="760" filter="url(#grain)" opacity=".32"/>

  <g fill="#b8f3f8" opacity=".48">
    <circle cx="114" cy="88" r="1"/><circle cx="226" cy="132" r=".7"/><circle cx="364" cy="74" r=".9"/>
    <circle cx="492" cy="116" r=".7"/><circle cx="1082" cy="80" r=".9"/><circle cx="1190" cy="132" r=".7"/>
    <circle cx="1348" cy="86" r="1"/><circle cx="1492" cy="146" r=".7"/>
  </g>

  <!-- background bodies are supporting depth, never competing focal points -->
  <circle cx="-72" cy="286" r="214" fill="#0a161c" opacity=".42"/>
  <ellipse cx="-22" cy="250" rx="176" ry="112" fill="#4a7b85" opacity=".035"/>
  <circle cx="1438" cy="178" r="31" fill="#acc6cd" opacity=".11"/>
  <circle cx="1429" cy="169" r="18" fill="#d6e4e6" opacity=".025"/>

  <!-- distant mountains / horizon -->
  <path d="M0 428 C118 392 182 418 265 386 C344 354 414 408 505 380 C602 350 684 398 790 368 C892 340 1000 395 1106 372 C1216 349 1346 395 1600 352 L1600 494 L0 494 Z" fill="#071116" opacity=".94"/>
  <path d="M0 438 C118 402 182 428 265 396 C344 364 414 418 505 390 C602 360 684 408 790 378 C892 350 1000 405 1106 382 C1216 359 1346 405 1600 362" fill="none" stroke="#36525a" stroke-width="1" opacity=".36"/>

  <!-- vertical architectural light, physically occluded by Core -->
  <g mask="url(#beamMask)">
    <rect x="794" y="8" width="12" height="504" fill="url(#beam)" opacity=".22" filter="url(#glowM)"/>
    <rect x="798.5" y="8" width="3" height="504" fill="url(#beam)" opacity=".72" filter="url(#glowS)"/>
  </g>

  <!-- restrained orbit / structure -->
  <circle cx="800" cy="246" r="190" fill="none" stroke="#60dbe6" stroke-width="20" opacity=".035" filter="url(#glowM)"/>
  <path d="M652 122 A190 190 0 0 1 947 116" fill="none" stroke="#73e2ec" stroke-width="1" opacity=".16"/>
  <path d="M953 354 A190 190 0 0 1 670 389" fill="none" stroke="#73e2ec" stroke-width=".8" opacity=".10"/>
  <path d="M624 196 A226 116 -12 0 0 979 312" fill="none" stroke="#72dce6" stroke-width=".8" opacity=".08"/>

  <!-- structural ring with localized luminance -->
  <circle cx="800" cy="246" r="160" fill="none" stroke="#45c8d4" stroke-width="22" opacity=".055" filter="url(#glowM)"/>
  <circle cx="800" cy="246" r="158" fill="none" stroke="url(#rim)" stroke-width="4.2" filter="url(#glowS)"/>
  <path d="M681 144 A158 158 0 0 1 749 96" fill="none" stroke="#d6fdff" stroke-width="2.2" opacity=".58" filter="url(#glowS)"/>
  <path d="M922 345 A158 158 0 0 1 881 386" fill="none" stroke="#9ff6fb" stroke-width="1.8" opacity=".4" filter="url(#glowS)"/>

  <!-- continuous sculpted Core volume -->
  <circle cx="800" cy="246" r="146" fill="url(#coreVolume)"/>
  <circle cx="800" cy="246" r="143" fill="url(#coreSheen)"/>
  <g clip-path="url(#coreClip)">
    <ellipse cx="754" cy="183" rx="126" ry="104" fill="#77dfe8" opacity=".035"/>
    <path d="M664 240 C690 190 744 164 800 164 C858 164 910 191 936 240 C912 222 878 210 844 211 C827 212 812 217 800 226 C787 217 772 212 754 211 C719 210 687 222 664 240 Z" fill="#071217" opacity=".68"/>
    <path d="M660 262 C706 239 744 234 800 234 C856 234 895 240 940 263 C922 332 868 378 800 382 C732 378 678 332 660 262 Z" fill="url(#coreShade)" opacity=".88"/>
    <path d="M680 170 C723 133 766 124 807 126 C851 128 893 148 922 180" fill="none" stroke="#b6f8fb" stroke-width="18" opacity=".025" filter="url(#glowM)"/>
    <ellipse cx="758" cy="205" rx="76" ry="48" fill="#54c4cf" opacity=".028" transform="rotate(-14 758 205)"/>
  </g>

  <!-- recessed eye apertures -->
  <g clip-path="url(#coreClip)">
    <path d="M708 243 C730 225 755 220 780 226 C766 229 752 235 739 247 C729 256 718 258 705 254 Z" fill="#020608" opacity=".95"/>
    <path d="M892 243 C870 225 845 220 820 226 C834 229 848 235 861 247 C871 256 882 258 895 254 Z" fill="#020608" opacity=".95"/>
    <path d="M711 245 C733 228 754 225 777 230 C760 233 747 239 737 248 C729 254 719 256 709 252 Z" fill="url(#eyeLightL)" filter="url(#glowS)"/>
    <path d="M889 245 C867 228 846 225 823 230 C840 233 853 239 863 248 C871 254 881 256 891 252 Z" fill="url(#eyeLightR)" filter="url(#glowS)"/>
    <path d="M722 249 C738 238 752 235 767 236" fill="none" stroke="#e1feff" stroke-width="1.2" opacity=".62"/>
    <path d="M878 249 C862 238 848 235 833 236" fill="none" stroke="#e1feff" stroke-width="1.2" opacity=".62"/>
  </g>

  <!-- illuminated platform and foreground architecture -->
  <ellipse cx="800" cy="454" rx="206" ry="24" fill="#62dbe5" opacity=".09" filter="url(#glowM)"/>
  <path d="M0 470 C280 448 532 460 800 449 C1068 460 1320 448 1600 470 L1600 760 L0 760 Z" fill="url(#floor)"/>
  <path d="M0 482 C280 460 532 472 800 461 C1068 472 1320 460 1600 482" fill="none" stroke="url(#horizonGlow)" stroke-width="2.2" opacity=".62"/>
  <path d="M0 495 C300 476 542 486 800 476 C1058 486 1300 476 1600 495" fill="none" stroke="#405c64" stroke-width="1" opacity=".28"/>

  <path d="M608 474 L992 474 L1054 760 L546 760 Z" fill="#040a0d" opacity=".94"/>
  <path d="M641 480 L959 480 L929 760 L671 760 Z" fill="#0a151a" opacity=".86"/>
  <path d="M705 484 L895 484 L862 760 L738 760 Z" fill="#0f1f25" opacity=".72"/>
  <path d="M800 480 L800 760" stroke="#86edf3" stroke-width="1.8" opacity=".18"/>
  <path d="M686 500 L914 500" stroke="url(#horizonGlow)" stroke-width="1.3" opacity=".62"/>
  <path d="M722 521 L878 521" stroke="#8feff4" stroke-width="1" opacity=".20"/>
  <path d="M748 466 L781 760 L819 760 L852 466" fill="url(#reflection)" opacity=".66"/>

  <!-- side architecture and rail light -->
  <path d="M244 464 L244 427 L256 414 L268 427 L268 464" fill="#04090c" stroke="#36535b" opacity=".82"/>
  <path d="M1332 464 L1332 427 L1344 414 L1356 427 L1356 464" fill="#04090c" stroke="#36535b" opacity=".82"/>
  <circle cx="256" cy="416" r="3" fill="#76eaf2" filter="url(#glowS)"/>
  <circle cx="1344" cy="416" r="3" fill="#76eaf2" filter="url(#glowS)"/>
  <path d="M0 448 L244 448 M268 448 L608 448 M992 448 L1332 448 M1356 448 L1600 448" stroke="#546d74" stroke-width="2" opacity=".38"/>

  <!-- floor reflection and haze -->
  <ellipse cx="800" cy="520" rx="190" ry="18" fill="#58ced8" opacity=".07" filter="url(#glowM)"/>
  <path d="M0 428 C360 402 604 439 800 432 C1030 424 1262 400 1600 432 L1600 548 C1260 524 1010 542 800 536 C560 530 310 518 0 544 Z" fill="#4ac6d0" opacity=".018" filter="url(#haze)"/>
</svg>