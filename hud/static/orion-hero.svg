<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="Decorative Orion cosmic scene">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#16323a"/>
      <stop offset="42%" stop-color="#0a171d"/>
      <stop offset="100%" stop-color="#03080b"/>
    </radialGradient>
    <radialGradient id="orbFill" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#11272d"/>
      <stop offset="72%" stop-color="#040a0d"/>
      <stop offset="100%" stop-color="#010406"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101b20"/>
      <stop offset="100%" stop-color="#030709"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#63e5ef" stop-opacity="0"/>
      <stop offset="50%" stop-color="#63e5ef" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#63e5ef" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <mask id="orbMask">
      <rect width="1600" height="760" fill="white"/>
      <circle cx="800" cy="292" r="168" fill="black"/>
    </mask>
  </defs>

  <rect width="1600" height="760" fill="url(#bgGlow)"/>

