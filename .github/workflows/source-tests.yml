name: Orion source tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: HUD bridge and projection tests
        run: python -m unittest discover -s hud/tests -p "test_*.py" -v
      - name: Vault disposable tests
        run: python -m unittest discover -s hermes_plugins/orion-vault-actions/tests -p "test_*.py" -v
      - name: Lifecycle provenance tests
        run: python -m unittest discover -s tests/operator -p "test_*.py" -v
      - name: Browser logic tests
        shell: bash
        run: node --test hud/tests/*.cjs
