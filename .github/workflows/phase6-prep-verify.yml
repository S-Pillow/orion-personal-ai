name: Phase 6 prep verification

on:
  push:
    branches:
      - prep/phase6-p6-02-p6-07
  pull_request:
    paths:
      - "docs/phase6/**"
      - "scripts/phase6/**"
      - ".github/workflows/phase6-prep-verify.yml"

jobs:
  verify-prep:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse Phase 6 PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem scripts/phase6 -Filter *.ps1 -File
          if (-not $scripts) {
            throw 'No Phase 6 PowerShell scripts found.'
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parse failure: $($script.Name)"
            }
            Write-Host "PARSE_PASS=$($script.Name)"
          }

      - name: Parse Phase 6 scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem scripts/phase6 -Filter *.ps1 -File
          if (-not $scripts) {
            throw 'No Phase 6 PowerShell scripts found.'
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "Windows PowerShell parse failure: $($script.Name)"
            }
            Write-Host "WINPS_PARSE_PASS=$($script.Name)"
          }

      - name: Compile and smoke Phase 6 Python helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/phase6/p6-readonly-schema-probe.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Phase 6 Python compile failed.'
          }

          $db = Join-Path $env:RUNNER_TEMP 'p6-schema-smoke.db'
          python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE executions (id TEXT PRIMARY KEY, job_id TEXT NOT NULL, status TEXT NOT NULL)'); c.commit(); c.close()" $db
          if ($LASTEXITCODE -ne 0) {
            throw 'Phase 6 SQLite smoke fixture creation failed.'
          }

          $output = python scripts/phase6/p6-readonly-schema-probe.py $db
          if ($LASTEXITCODE -ne 0) {
            throw 'Phase 6 schema probe smoke failed.'
          }
          $output
          if ($output -notcontains 'SQLITE_MODE=read_only') {
            throw 'Schema probe did not confirm read-only open.'
          }
          if ($output -notcontains 'TABLE=executions;present=True') {
            throw 'Schema probe did not observe executions table.'
          }

      - name: Guard prep-only scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            '^docs/phase6/',
            '^scripts/phase6/',
            '^\.github/workflows/phase6-prep-verify\.yml$'
          )

          $base = '${{ github.event.pull_request.base.sha }}'
          if (-not $base) {
            $base = 'HEAD~1'
          }

          $changed = git diff --name-only "$base...HEAD"
          if ($LASTEXITCODE -ne 0) {
            throw "git diff failed for Phase 6 prep scope check"
          }
          foreach ($path in $changed) {
            $ok = $false
            foreach ($pattern in $allowed) {
              if ($path -match $pattern) {
                $ok = $true
                break
              }
            }
            if (-not $ok) {
              throw "Unexpected Phase 6 prep path: $path"
            }
          }

          Write-Host 'PHASE6_PREP_SCOPE=PASS'
