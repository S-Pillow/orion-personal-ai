name: Orion UI verification

on:
  push:
    branches:
      - feature/orion-ui-visual-convergence-pass
      - feature/orion-phase5-p5-03c-reconnect-hydration

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare evidence directory
        run: mkdir -p ui-visual-artifacts
      - name: Compile P5-03C operator verifiers
        run: |
          python -m py_compile scripts/phase5/p5-03c-installed-readonly-qualification.py
          python -m py_compile scripts/phase5/p5-03c-stage-d-discover-evidence.py
          python -m py_compile scripts/phase5/p5-03c-stage-d-disposable-preflight.py
          python -m py_compile scripts/phase5/p5-03c-stage-d-disposable-reconnect.py
          python -m py_compile scripts/phase5/p5-03c-stage-d-resume-reconstruction.py
      - name: Python HUD tests
        id: python_tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s hud/tests -p "test_*.py" -v 2>&1 | tee ui-visual-artifacts/python-tests.txt
          code=${PIPESTATUS[0]}
          echo "$code" > ui-visual-artifacts/python-tests.exit
          exit 0
      - name: Node renderer tests
        id: node_tests
        shell: bash
        run: |
          set +e
          node --test hud/tests/test_approval_rendering.cjs hud/tests/test_summon_rendering.cjs hud/tests/test_action_workspace_semantics.cjs hud/tests/test_core_attention.cjs hud/tests/test_reconnect_state.cjs 2>&1 | tee ui-visual-artifacts/node-tests.txt
          code=${PIPESTATUS[0]}
          echo "$code" > ui-visual-artifacts/node-tests.exit
          exit 0
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile fixtures
        id: visual_capture
        shell: bash
        run: |
          set +e
          python hud/tests/capture_ui_visuals.py 2>&1 | tee ui-visual-artifacts/visual-capture.txt
          code=${PIPESTATUS[0]}
          echo "$code" > ui-visual-artifacts/visual-capture.exit
          exit 0
      - name: Qualify reconnect and hydration
        id: reconnect_qualification
        shell: bash
        run: |
          set +e
          python hud/tests/capture_reconnect_hydration.py 2>&1 | tee ui-visual-artifacts/reconnect-qualification.txt
          code=${PIPESTATUS[0]}
          echo "$code" > ui-visual-artifacts/reconnect-qualification.exit
          cp -r p5-03c-artifacts ui-visual-artifacts/p5-03c-artifacts 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-ui-visual-artifacts
          path: ui-visual-artifacts/
          if-no-files-found: error
      - name: Enforce verification gates
        if: always()
        shell: bash
        run: |
          py=$(cat ui-visual-artifacts/python-tests.exit 2>/dev/null || echo 1)
          node=$(cat ui-visual-artifacts/node-tests.exit 2>/dev/null || echo 1)
          visual=$(cat ui-visual-artifacts/visual-capture.exit 2>/dev/null || echo 1)
          reconnect=$(cat ui-visual-artifacts/reconnect-qualification.exit 2>/dev/null || echo 1)
          echo "python=$py node=$node visual=$visual reconnect=$reconnect"
          test "$py" -eq 0
          test "$node" -eq 0
          test "$visual" -eq 0
          test "$reconnect" -eq 0
