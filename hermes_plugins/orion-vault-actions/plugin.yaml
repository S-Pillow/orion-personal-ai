name: orion-vault-actions
version: "0.4.0"
description: "Orion native read-only vault retrieval plus guarded preview and apply tools. Retrieval uses iai ordering and exact current Markdown sources; protected mutation remains disabled unless explicit mutation_enabled mode passes the qualified approval and recovery guardrails."
provides_hooks:
  - pre_tool_call
  - post_approval_response
provides_tools:
  - orion_vault_preview_edit
  - orion_vault_preview_move_draft
  - orion_vault_preview_delete
  - orion_vault_recommend_destination
  - orion_vault_retrieve
  - orion_vault_apply_plan
